<!doctype html><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/static/style.css"><main><h1>THANGATHI SCHOOL - ADD STUDENT</h1><form method="post" class="form"><input name="name" placeholder="Student name" required><input name="admission" placeholder="Admission No."><input name="class_name" placeholder="Class"><select name="gender"><option>Male</option><option>Female</option></select><input name="parent_phone" placeholder="Parent WhatsApp e.g. 254712345678"><input name="balance" type="number" step="0.01" placeholder="School balance">{% for x in subjects %}<label>{{x}} / 50<input name="{{x}}" type="number" min="0" max="50" step="0.01" value="0"></label>{% endfor %}<button>SAVE STUDENT</button></form></main>
